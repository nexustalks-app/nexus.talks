plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nexustalks.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.nexustalks.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        def defaultUrl = project.findProperty("SERVER_URL") ?: ""
        buildConfigField "String", "DEFAULT_SERVER_URL", "\"${defaultUrl}\""
    }

    signingConfigs {
        release {
            def localProperties = new Properties()
            def localPropertiesFile = rootProject.file('local.properties')
            if (localPropertiesFile.exists()) {
                localPropertiesFile.withInputStream { localProperties.load(it) }
            }

            def keystorePath = localProperties.getProperty('RELEASE_KEYSTORE_PATH') ?:
                               project.findProperty("KEYSTORE_FILE") ?:
                               System.getenv("KEYSTORE_FILE") ?:
                               "${System.getProperty('user.home')}/.android/nexus-talks-release.jks"

            def keystorePassword = localProperties.getProperty('RELEASE_KEYSTORE_PASSWORD') ?:
                                   project.findProperty("KEYSTORE_PASSWORD") ?:
                                   System.getenv("KEYSTORE_PASSWORD")

            def keyAliasVal = localProperties.getProperty('RELEASE_KEY_ALIAS') ?:
                              project.findProperty("KEY_ALIAS") ?:
                              System.getenv("KEY_ALIAS") ?:
                              "nexus-talks"

            def keyPass = localProperties.getProperty('RELEASE_KEY_PASSWORD') ?:
                          project.findProperty("KEY_PASSWORD") ?:
                          System.getenv("KEY_PASSWORD") ?:
                          keystorePassword

            if (keystorePath && file(keystorePath).exists() && keystorePassword) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasVal
                keyPassword keyPass
            } else {
                def defaultDebugKeystore = file("${System.getProperty('user.home')}/.android/debug.keystore")
                if (defaultDebugKeystore.exists()) {
                    storeFile defaultDebugKeystore
                    storePassword "android"
                    keyAlias "androiddebugkey"
                    keyPassword "android"
                }
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
